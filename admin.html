<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SankzyTech — Content Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="wrap admin-header-inner">
    <a href="index.html" class="logo">SankzyTech</a>
    <span class="admin-label">Content Manager</span>
  </div>
</header>

<main class="wrap admin-main">

  <!-- Login gate -->
  <section id="login-gate" class="admin-panel">
    <h1>Sign in</h1>
    <p class="admin-sub">Enter the admin key to manage site content.</p>
    <form id="login-form" class="admin-form" novalidate>
      <div class="field">
        <label for="admin-key">Admin key</label>
        <input type="password" id="admin-key" name="adminKey" autocomplete="off" required />
      </div>
      <button type="submit" class="btn btn-signal">Unlock</button>
      <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- Manager view (hidden until unlocked) -->
  <section id="manager-view" class="admin-panel hidden">
    <div class="admin-toolbar">
      <h1>Content items</h1>
      <div class="admin-toolbar-actions">
        <button type="button" class="btn-ghost" id="refresh-btn">Refresh</button>
        <button type="button" class="btn btn-signal" id="new-item-btn">+ New item</button>
        <button type="button" class="btn-ghost" id="logout-btn">Log out</button>
      </div>
    </div>

    <p class="form-status" id="list-status" role="status" aria-live="polite"></p>

    <div class="content-table-wrap">
      <table class="content-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Section</th>
            <th>Content</th>
            <th>Updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="content-tbody">
          <!-- rows injected by admin.js -->
        </tbody>
      </table>
    </div>
    <p id="empty-state" class="empty-state hidden">No content items yet — add your first one.</p>
  </section>

</main>

<!-- Add / edit modal -->
<div id="item-modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modal-title">New content item</h2>
    <form id="item-form" class="admin-form" novalidate>
      <input type="hidden" id="item-id" />

      <div class="field">
        <label for="item-title">Title</label>
        <input type="text" id="item-title" required />
        <span class="field-error" data-error-for="title"></span>
      </div>

      <div class="field">
        <label for="item-section">Section</label>
        <input type="text" id="item-section" placeholder="e.g. services, team, announcements" />
        <span class="field-error" data-error-for="section"></span>
      </div>

      <div class="field">
        <label for="item-content">Content</label>
        <textarea id="item-content" rows="6" required></textarea>
        <span class="field-error" data-error-for="content"></span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancel-modal-btn">Cancel</button>
        <button type="submit" class="btn btn-signal" id="save-item-btn">Save</button>
      </div>
      <p class="form-status" id="modal-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
